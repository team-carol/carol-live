name: Release

# Signed APK attached to a GitHub Release; the app checks the latest release and offers the update.
# Two ways to start it:
#  - Actions > Release > Run workflow, version "0.5.0" (from main; creates the tag v0.5.0) - works from a phone
#  - push a tag like v0.5.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 0.5.0). main의 최신 커밋에 v태그를 만들고 릴리스합니다"
        required: true

permissions:
  contents: write

env:
  ROOTENCODER_SHA: 329d631b9c5e92762da7f1e3fc37c4a7358618be

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run it from the main branch"; exit 1
            fi
            v="${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              echo "::error::v$v already exists. Use a new version number"; exit 1
            fi
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.5.0 (got '$v')"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch RootEncoder
        run: |
          git init -q android/RootEncoder
          git -C android/RootEncoder fetch -q --depth 1 https://github.com/pedroSG94/RootEncoder.git "$ROOTENCODER_SHA"
          git -C android/RootEncoder checkout -q FETCH_HEAD
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing (see README: 릴리스)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # monotonically increasing version code for updates
          CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon :app:assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$CODE"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/carol-live-v${VERSION}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      # creates the tag at this commit when started from the Actions tab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
