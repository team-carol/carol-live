name: Release

# push a tag like v0.3.1 -> signed APK attached to a GitHub Release.
# The app checks the latest release and offers the update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ROOTENCODER_SHA: 329d631b9c5e92762da7f1e3fc37c4a7358618be

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch RootEncoder
        run: |
          git init -q android/RootEncoder
          git -C android/RootEncoder fetch -q --depth 1 https://github.com/pedroSG94/RootEncoder.git "$ROOTENCODER_SHA"
          git -C android/RootEncoder checkout -q FETCH_HEAD
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing (see README: 릴리스)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # monotonically increasing version code for updates
          CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon :app:assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$CODE"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/carol-live-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
