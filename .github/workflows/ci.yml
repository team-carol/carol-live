name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # RootEncoder is built from source (android/settings.gradle.kts includeBuild); pin the commit
  ROOTENCODER_SHA: 329d631b9c5e92762da7f1e3fc37c4a7358618be

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch RootEncoder
        run: |
          git init -q android/RootEncoder
          git -C android/RootEncoder fetch -q --depth 1 https://github.com/pedroSG94/RootEncoder.git "$ROOTENCODER_SHA"
          git -C android/RootEncoder checkout -q FETCH_HEAD
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: carol-live-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Typecheck server
        working-directory: server
        run: npm ci && npm run typecheck
