name: Deploy server

# main changes under server/ or web/ -> D1 migrations + `wrangler deploy` (worker + web assets)
# needs the repo secret CLOUDFLARE_API_TOKEN (README: 서버 배포). Also runnable from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["server/**", "web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing (README: 서버 배포)"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --prefix web
          npm ci --prefix server
      - name: D1 migrations
        working-directory: server
        run: npx wrangler d1 migrations apply carol-live --remote
      - name: Deploy
        working-directory: server
        run: npm run deploy
